name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to dry-run, without the v prefix'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_BRANCH: develop
  APP_NAME: relay-translate
  # beta = tester builds (Phase 10). Switch to prod once releases go to the public.
  FLAVOR: beta

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require release commit on the release branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::Tag must point to a commit on $RELEASE_BRANCH."
            exit 1
          fi

      - name: Check pubspec version
        shell: bash
        run: |
          MANIFEST_VERSION=$(
            grep -E '^version:' pubspec.yaml |
            sed -E 's/^version:[[:space:]]*//' |
            cut -d'+' -f1
          )

          EXPECTED="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$EXPECTED" ]; then
            echo "::error::pubspec.yaml is $MANIFEST_VERSION but release is $EXPECTED."
            exit 1
          fi

      - name: Extract release notes
        working-directory: .
        run: |
          node tools/changelog-section.mjs \
            "${{ steps.version.outputs.version }}" \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Goldens are Windows snapshots; Linux antialiasing differs by ~0.04 % (app/dart_test.yaml).
      - name: Test
        run: flutter test --exclude-tags golden

      - name: Write Android signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          test -n "$KEYSTORE_BASE64" || missing+=("ANDROID_KEYSTORE_BASE64")
          test -n "$STORE_PASSWORD" || missing+=("ANDROID_KEYSTORE_PASSWORD")
          test -n "$KEY_ALIAS" || missing+=("ANDROID_KEY_ALIAS")
          test -n "$KEY_PASSWORD" || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One APK per CPU architecture instead of a universal one (ML Kit native libs make the universal APK big).
      - name: Build
        shell: bash
        run: |
          flutter build apk --release --flavor "$FLAVOR" --split-per-abi
          mkdir -p "$RUNNER_TEMP/apks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-$FLAVOR-release.apk" \
              "$RUNNER_TEMP/apks/${APP_NAME}-${{ steps.version.outputs.version }}-$abi.apk"
          done
          ls -lh "$RUNNER_TEMP/apks"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/release.keystore

      - name: Reject a debug-signed APK
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          for APK in "$RUNNER_TEMP"/apks/*.apk; do
            CERT=$("$APKSIGNER" verify --print-certs "$APK")
            echo "$APK"; echo "$CERT"
            if echo "$CERT" | grep -q "CN=Android Debug"; then
              echo "::error::$APK is signed with the Android debug certificate."
              exit 1
            fi
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/apks/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Relay Translate ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ runner.temp }}/apks/*.apk
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
